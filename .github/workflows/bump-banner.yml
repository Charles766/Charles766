name: build-banner

on:
  push:
    paths:
      - "assets/banner-dark.svg"
      - "assets/banner-light.svg"
      - "scripts/build_banner.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme      # 与另外两个 workflow 共用队列，避免同时改 README
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build banner and bump version
        run: python scripts/bump_banner.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/banner.svg README.md
          if git diff --cached --quiet; then
            echo "no change, skip"
          else
            git commit -m "chore: rebuild banner + bump version"
            git push
          fi
