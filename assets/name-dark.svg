<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 620 50" width="620" height="50" role="img">
  <title>Charles</title>
  <desc>名字逐字打出，每打完一次换一种颜色。深色版用低饱和的浅色，浅色版用压深的中色，两边都保证看得清。</desc>
  <style>
@font-face {
  font-family: 'Playfair Display';
  font-style: normal;
  font-weight: 600;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
    /* 颜色按 6 轮一循环。切换点都落在文字已经删空的那一刻，所以看不出跳变。
       用 CSS 而不是 SMIL 的 calcMode="discrete" —— 后者对颜色不生效，会变成渐变。 */
    @keyframes hue {
      0.0000%, 16.6666% { fill: #F2A0B5 }
      16.6667%, 33.3332% { fill: #9FC6F5 }
      33.3333%, 49.9999% { fill: #A8D8B9 }
      50.0000%, 66.6666% { fill: #E6C48A }
      66.6667%, 83.3332% { fill: #C4A8F0 }
      83.3333%, 99.9999% { fill: #86CFC4 }
      100% { fill: #F2A0B5 }
    }
    .nm { animation: hue 27600ms linear infinite }
  </style>

  <!-- 打字进度：这条线从 0 长到 620，textPath 沿它逐字显形 -->
  <path id="tw" d="m0,25 h620" fill="none">
    <animate attributeName="d" begin="0s;tw.end" dur="4600ms" fill="remove"
             values="m0,25 h0 ; m0,25 h620 ; m0,25 h620 ; m0,25 h0"
             keyTimes="0;0.55652;0.86087;1"/>
  </path>

  <text class="nm" font-family='"Playfair Display", monospace' font-size="40"
        dominant-baseline="middle" x="50%" text-anchor="middle"
        letter-spacing="normal" fill="#F2A0B5">
    <textPath xlink:href="#tw">Charles</textPath>
  </text>
</svg>
