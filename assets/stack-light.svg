<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img">
  <title>技术栈索引</title>
  <desc>以书页目录形式排列的语言、框架与工具清单。</desc>

  <rect x="2" y="2" width="776" height="246" rx="14" fill="#FDF7FA" stroke="#F0E6EE" stroke-width="1"/>

  <line x1="200" y1="30" x2="200" y2="228" stroke="#E8D9E4" stroke-width="0.8"/>

  <g font-family="Georgia, 'Times New Roman', 'Songti SC', SimSun, serif">
    <text x="30" y="55" font-size="20" fill="#7A6E85">语言</text>
    <text x="30" y="75" font-size="9.5" letter-spacing="2.2" fill="#A294AC">LANGUAGES</text>
    <text x="30" y="130" font-size="20" fill="#7A6E85">框架</text>
    <text x="30" y="150" font-size="9.5" letter-spacing="2.2" fill="#A294AC">FRAMEWORKS</text>
    <text x="30" y="205" font-size="20" fill="#7A6E85">工具</text>
    <text x="30" y="225" font-size="9.5" letter-spacing="2.2" fill="#A294AC">TOOLS</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', 'Songti SC', SimSun, serif" font-size="22">
    <circle cx="230" cy="48" r="2.9" fill="#C4567C"/>
    <text x="248" y="55" fill="#C4567C">TypeScript</text>

    <circle cx="385" cy="48" r="2.9" fill="none" stroke="#7B5FC4" stroke-width="1.2"/>
    <text x="403" y="55" fill="#7B5FC4">Go</text>

    <circle cx="460" cy="48" r="2.9" fill="#3E8FB0"/>
    <text x="478" y="55" fill="#3E8FB0">Rust</text>

    <circle cx="555" cy="48" r="2.9" fill="#7B5FC4"/>
    <text x="573" y="55" fill="#7B5FC4">Python</text>

    <circle cx="230" cy="123" r="2.9" fill="none" stroke="#3E8FB0" stroke-width="1.2"/>
    <text x="248" y="130" fill="#3E8FB0">React</text>

    <circle cx="350" cy="123" r="2.9" fill="#C4567C"/>
    <text x="368" y="130" fill="#C4567C">Node.js</text>

    <circle cx="230" cy="198" r="2.9" fill="#7B5FC4"/>
    <text x="248" y="205" fill="#7B5FC4">PostgreSQL</text>

    <circle cx="398" cy="198" r="2.9" fill="none" stroke="#3E8FB0" stroke-width="1.2"/>
    <text x="416" y="205" fill="#3E8FB0">Redis</text>

    <circle cx="502" cy="198" r="2.9" fill="#C4567C"/>
    <text x="520" y="205" fill="#C4567C">Docker</text>

    <circle cx="618" cy="198" r="2.9" fill="none" stroke="#3E8FB0" stroke-width="1.2"/>
    <text x="640" y="205" fill="#3E8FB0">Linux</text>
  </g>
</svg>
